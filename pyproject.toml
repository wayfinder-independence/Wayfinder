[project]
name = "wayfinder"
version = "0.1.0"
description = "Helping neurodivergent people do more of everyday life on their own terms."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["python-docx>=1.1"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["wayfinder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
